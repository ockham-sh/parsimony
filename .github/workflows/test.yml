name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: uv tool run ruff check parsimony/ tests/ examples/
      - run: uv tool run ruff format --check parsimony/ tests/ examples/

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: uv pip install --system -e ".[dev]"
      - run: mypy parsimony/

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv pip install --system -e ".[dev]"
      - run: pytest tests/ -v -m "not integration" --cov=parsimony --cov-report=term-missing --cov-fail-under=80

  import-smoke:
    # Cross-platform import gate. The Linux `test` matrix never catches
    # import-time platform breakage (a module-level reference to a Linux-only
    # stdlib constant, say) — that class shipped in parsimony-sdmx 0.0.1 as an
    # AttributeError on macOS/Windows (parsimony-connectors#44). A bare
    # `pip install parsimony` + `import parsimony` on the two OSes the
    # Linux matrix omits is the whole gate: `import parsimony` is deliberately
    # cheap (heavy deps are lazy via PEP 562), so no extras are needed and
    # pytest is not run. py3.12 only — import-time breakage is not
    # Python-minor specific.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: uv pip install --system -e .
      - run: python -c "import parsimony; print('Import OK:', parsimony.__name__)"

  audit:
    # Supply-chain audit against the full [standard,litellm] surface (the
    # dev extra pulls both). Required gate — treat as a hard gate, not
    # dev-only, because every CVE in torch/faiss/huggingface_hub/litellm
    # becomes a parsimony CVE.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: uv pip install --system -e ".[dev]"
      - name: pip-audit on resolved environment
        # --disable-pip only applies with -r requirements.txt. Audit the
        # installed environment (which includes the [dev] extra) instead.
        run: uv tool run pip-audit --strict
