[project]
name = "parsimony-core"
version = "0.7.5"
description = "Connector framework for financial data — typed fetch and hybrid-search catalogs."
authors = [{ name = "Ockham.sh", email = "team@ockham.sh" }]
license = "Apache-2.0"
readme = "README.md"
requires-python = ">=3.11"
keywords = ["finance", "data", "connectors", "fred", "sdmx", "catalog"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    # Mandatory kernel footprint — validation, data carriers, async HTTP,
    # cache directory resolution. The heavy *vector* catalog deps (FAISS,
    # sentence-transformers, hf) live under [catalog]; BM25 does not.
    "pydantic>=2.11.1,<3",
    "pandas>=2.3.0,<3",
    "pyarrow>=23.0.1",
    "httpx>=0.28.1",
    "platformdirs>=4.0.0,<5",
    # Lexical BM25 backend. Pure-Python on top of numpy (already pulled in by
    # pandas), so it adds ~no weight — and it is a base requirement because
    # `auto_catalog` and `BM25Index` are base, top-level features that must work
    # on a bare `pip install parsimony-core` (e.g. in the sandboxed agent kernel).
    "rank-bm25>=0.2",
]

[project.optional-dependencies]
# Vector catalog runtime: FAISS vectors + the sentence-transformers default
# embedder + the hf:// loader. BM25 keyword search is in the base install; this
# extra adds the *semantic* half. Stays optional so `pip install parsimony-core`
# never pulls torch.
catalog = [
    "faiss-cpu>=1.8.0",
    "sentence-transformers>=3.0.0",
    "huggingface_hub>=0.25.0",
]
# ONNX Runtime path for the catalog embedder — 2-3× faster than the
# PyTorch-backed SentenceTransformerEmbedder on x86 CPUs with AVX2 /
# AVX_VNNI (Intel Core Ultra, Xeon, Ryzen) via int8 dynamic quantization.
# Adds no GPU dependencies; the ONNX model is ~4× smaller than the PyTorch
# one. See :class:`parsimony.embedder.OnnxEmbedder`.
standard-onnx = [
    "parsimony-core[catalog]",
    "optimum[onnxruntime]>=1.22.0",
    "onnxruntime>=1.18.0",
]
# Hosted-API embedder via the litellm unified API (OpenAI, Gemini, Cohere,
# Voyage, Bedrock).
litellm = ["litellm>=1.59.0,<2"]
all = ["parsimony-core[catalog,standard-onnx,litellm]"]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=5.0",
    "ruff>=0.15.10",
    "mypy>=1.10",
    "types-requests>=2.31",
    "pip-audit>=2.7",
    # Dev pulls in the catalog extra so the full test suite exercises the
    # FAISS + BM25 + sentence-transformers paths.
    "parsimony-core[catalog,litellm]",
]
docs = [
    "mkdocs-material",
    # Pulls parsimony-connectors docs into the unified site at build time.
    # See `nav:` in mkdocs.yml — `!import` directives clone each sibling
    # repo's `docs/` subtree.
    "mkdocs-multirepo-plugin>=0.7",
]

[project.urls]
Homepage = "https://parsimony.dev"
Repository = "https://github.com/ockham-sh/parsimony"
Documentation = "https://docs.parsimony.dev"

[project.scripts]
parsimony = "parsimony.cli:main"

# No in-tree connectors. Every connector is published as its own
# parsimony-<name> distribution from the parsimony-connectors monorepo and
# discovered via the `parsimony.providers` entry-point group. See
# `docs/plugins/authoring.md` for the plugin contract.

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
# Target 3.12 (not the 3.11 floor) so mypy can parse numpy's PEP 695 `type`-statement
# stubs, which it rejects under a <3.12 target. The 3.11 pytest matrix backstops
# actual runtime-version compatibility.
python_version = "3.12"
warn_return_any = true
warn_unused_ignores = true
ignore_missing_imports = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["parsimony"]

[tool.hatch.build.targets.sdist]
include = ["parsimony", "README.md", "LICENSE", "CHANGELOG.md"]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib --cov=parsimony --cov-report=term-missing --cov-fail-under=80"
asyncio_mode = "auto"
pythonpath = ["."]
markers = [
    "integration: hits live APIs (may be slow, requires env vars)",
    "slow: heavy local test (e.g. large fixture); opt-in",
]

[tool.coverage.run]
omit = [
    # Requires sentence-transformers / litellm network I/O; unit tests use
    # fake embedders. Loading logic is covered by integration / live tests.
    "parsimony/embedder.py",
    # FAISS helpers are pure wrappers around a native library; exercised by
    # the Catalog save/load integration tests, not unit tests.
    "parsimony/indexes.py",
]
