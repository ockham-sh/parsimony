name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      target:
        description: "Where to publish"
        required: true
        default: "testpypi"
        type: choice
        options:
          - testpypi
          - pypi

permissions:
  contents: read
  id-token: write

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build sdist and wheel
        run: uv build

      - name: Show built artifacts
        run: ls -la dist/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  smoke:
    name: Published-resolution smoke
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the built wheel with deps from PyPI and smoke it
        shell: bash
        run: |
          set -euo pipefail
          # Gate publish on the artifact a user actually installs: a venv with no
          # source tree resolves parsimony-core's deps from PyPI, then we install
          # the freshly-built wheel and exercise import + the discovery entry
          # point. Mirrors the release gate in parsimony-connectors / parsimony-agents
          # — PR CI tracks trunk, the release gate tracks PyPI.
          venv="$RUNNER_TEMP/smoke"
          python3 -m venv "$venv"
          "$venv/bin/python" -m pip install --quiet --upgrade pip
          "$venv/bin/python" -m pip install "$(ls dist/*.whl)"
          "$venv/bin/python" -c "import parsimony; from parsimony.discover import load_all; load_all(); print('published-resolution smoke OK: parsimony-core')"
          # The bundled connectors.json fallback (parsimony/_data/) is a wheel
          # asset, not a source-tree file — confirm it actually made it into
          # the built artifact and that parsimony.registry can load it with
          # remote access cut off (proves the fallback path, not just import).
          "$venv/bin/python" -c "
          import unittest.mock as mock
          import httpx
          from parsimony.registry import list_available

          with mock.patch('httpx.get', side_effect=httpx.ConnectError('network disabled for this smoke test')):
              registry = list_available()
          assert registry.source == 'bundled', registry.source
          assert registry.connectors, 'bundled connectors.json produced zero rows'
          print(f'published-resolution smoke OK: bundled fallback ({len(registry.connectors)} connectors)')
          "

  verify-bundled-manifest:
    name: Bundled connectors.json matches upstream
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compare against the parsimony-connectors source of truth
        # parsimony/_data/connectors.json is a release-time snapshot, not a
        # runtime cache (see parsimony/_data/README.md) — this job makes
        # "keep it fresh" mechanical instead of "manual if remembered".
        # Fails the release if the bundled file drifts from what
        # ockham-sh/parsimony-connectors currently generates on its trunk
        # branch — the same source parsimony.dev/connectors.json proxies.
        run: |
          set -euo pipefail
          curl -fsSL \
            https://raw.githubusercontent.com/ockham-sh/parsimony-connectors/main/connectors.json \
            -o /tmp/upstream-connectors.json
          if ! diff -u parsimony/_data/connectors.json /tmp/upstream-connectors.json; then
            echo "::error file=parsimony/_data/connectors.json::stale — copy ../parsimony-connectors/connectors.json over this file verbatim before tagging this release."
            exit 1
          fi
          echo "parsimony/_data/connectors.json is byte-identical to parsimony-connectors@main."

  publish-pypi:
    name: Publish to PyPI
    if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.target == 'pypi')
    needs: [build, smoke, verify-bundled-manifest]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/parsimony-core
    permissions:
      id-token: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true

  publish-testpypi:
    name: Publish to TestPyPI
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'testpypi'
    needs: [build, smoke, verify-bundled-manifest]
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/parsimony-core
    permissions:
      id-token: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true
